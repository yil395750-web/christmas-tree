<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>送给你的圣诞树</title>
    <style>
        body {
            margin: 0;
            background: linear-gradient(#0b1026, #24365e);
            font-family: "Microssoft YaHei", sans-serif;
        }

        .screen {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .card {
            background: #fff8ec;
            color: #21304d;
            border-radius: 18px;
            padding: 28px 22px 34px;
            width: min(86vw, 330px);
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
            position: relative;
        }

        .card::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            bottom: -14px;
            height: 30px;
            background: #d63c32;
            border-radius: 0 0 18px 18px;
        }

        .treeEmoji {
            font-size: 64px;
        }

        .card h1 {
            font-size: 24px;
            margin: 12px 0 6px;
        }

        .from {
            color: #8a7a5f;
            font-size: 14px;
            margin: 0 0 14px
        }

        .mood {
            display: inline-block;
            background: #ffd94d;
            border-radius: 999px;
            padding: 6px 16px;
            font-weight: bold;
            font-size: 15px;
        }

        .ball {
            margin-top: 46px;
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            position: relative;
            background: radial-gradient(circle at 35% 30%, #ffd3e8, #ff6fae 45%, #e0337f);
            box-shadow: 0 12px 26px rgba(0, 0, 0, 0.5);
        }

        .ball::before {
            content: "";
            position: absolute;
            top: -13px;
            left: 50%;
            transform: translateX(-50%);
            width: 28px;
            height: 17px;
            background: linear-gradient(#ffe27a, #d9a441);
            border-radius: 4px;
        }

        .hint {
            margin-top: 14px;
            color: #ffe9a8;
            font-size: 15px;
        }

        .navbtn {
            margin-top: 22px;
            background: #ffd94d;
            color: #21304d;
            border: none;
            border-radius: 999px;
            padding: 10px 22px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .darkTree {
            font-size: 148px;
            line-height: 1.2;
            margin: 6px 0 4px;
            filter: brightness(0.22) saturate(0.55);
            transition: filter 0.6;
        }

        .darkTree.fullyLit {
            animation: treeGlow 2.2s ease-in-out infinite;
        }

        @keyframes treeGlow {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.03);
            }
        }

        .dots {
            display: flex;
            gap: 12px;
            margin: 14px 0 16px;
        }

        .dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 2px solid rgba(255, 217, 77, 0.9);
            background: transparent;
            transition: background 0.4, box-shadow 0.4s;
        }

        .dot.on {
            background: #ffd94d;
            box-shadow: 0 0 12px 3px rgba(255, 217, 77, 0.75);
        }

        .caption {
            min-height: 24px;
            font-size: 16px;
            color: #ffe9a8;
        }

        .lightbtn {
            margin-top: 22px;
            background: #d94f3d;
            color: #fff7ea;
            border: none;
            border-radius: 999px;
            padding: 12px 30px;
            font-weight: bold;
            cursor: pointer;
        }

        #toTree {
            display: none;
        }

        .resetbtn {
            margin-top: 18px;
            background: none;
            border: none;
            color: rgba(244, 240, 228, 0.55);
            font-size: 13px;
            cursor: pointer;
            text-decoration: underline;
        }
        #cv {
            border-radius: 16px;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>

<body>
    <section class="screen" id="act1">
        <div class="card">
            <div class="treeEmoji">🎄</div>
            <h1>邀请你来看圣诞树</h1>
            <p class="from">___出自车召</p>
            <div class="mood">这你点我？嘎达嘎达</div>
        </div>
        <button class="ball" onclick="showAct(2)"></button>
        <div class="hint">点这颗球，拆开看看 👆</div>
    </section>
    <section class="screen" id="act2" style="display:none">
        <h2>第二幕.点灯仪式</h2>
        <div class="darkTree" id="darkTree">🎄</div>
        <div class="dots">
            <span class="dot" id="dot1"></span>
            <span class="dot" id="dot2"></span>
            <span class="dot" id="dot3"></span>
            <span class="dot" id="dot4"></span>
            <span class="dot" id="dot5"></span>
        </div>
        <p class="caption" id="caption">请点下面的按钮，一下一下把它点亮。</p>
        <button class="lightbtn" id="lightBtn" onclick="lightUp()">点亮它</button>
        <button class="navbtn" id="toTree" onclick="showAct(3)">去看树 &rarr;</button>
        <button class="resetbtn" onclick="resetCeremony()">重新点灯</button>
    </section>
    <section class="screen" id="act3" style="display:none">
        <h2>第三幕 . 圣诞树</h2>
        <canvas id="cv" width="340" height="480"></canvas>
        <p class="hint">点一点树，挂个彩球</p>
        <button class="navbtn" onclick="showAct(1)">&larr; 回到邀请函</button>
        <button class="navbtn" onclick="toggleSnow()">❄️ 开关雪</button>
        <button class="navbtn" onclick="toggleLights()">💡 开关灯</button>
        <button class="navbtn" onclick="clearBalls()">🧹 清空彩球</button>
        <p class="hint">寄语：我真牛逼</p>
    </section>
    <script>
        function showAct(n) {
            const ids = ["act1", "act2", "act3"];
            for (let i = 0; i < ids.length; i++) {
                document.getElementById(ids[i]).style.display = "none";
            }
            document.getElementById("act" + n).style.display = "flex";
        }
        var lit = 0;
        var captions = [
            "请点下面的按钮，一下一下把它点亮。",
            "第一下————树顶的星星亮了。",
            "第二下————枝丫开始透出光来。",
            "第三下————过半了，很快很快",
            "第四下————就差最后一下。",
            "完美，圣诞快乐 🎄 要去看看完整吗？"
        ];
        function lightUp() {
            if (lit >= 5) { return; }
            lit = lit + 1;
            var tree = document.getElementById("darkTree");
            tree.style.filter = "brightness(" + (0.22 + lit * 0.2) + ") " + "saturate(" + (0.55 + lit * 0.11) + ") " + "drop-shadow(0 0 " + (lit * 9) + "px rgba(255, 210, 90, " + (lit * 0.13) + "))";
            document.getElementById("dot" + lit).classList.add("on");
            document.getElementById("caption").textContent = captions[lit];
            var btn = document.getElementById("lightBtn");    function toggleSnow() {
        snowOn = !snowOn;
    }
            if (lit>= 5) {
                btn.style.display = "none";
                document.getElementById("toTree").style.display = "inline-block";
                tree.classList.add("fullyLit");
            } else {
                btn.textContent = "点亮它 (还剩 " + (5 - lit) + " 下) ";
            }
        }
        function resetCeremony() {
            lit = 0;
            var tree = document.getElementById("darkTree");
            tree.style.filter = "";
            tree.classList.remove("fullyLit");
            for (var i = 1; i <= 5; i++) {
                document.getElementById("dot" + i).classList.remove("on");
            }
            document.getElementById("caption").textContent = captions[0];
            var btn = document.getElementById("lightBtn");
            btn.style.display = "";
            btn.textContent = "点亮它";
            document.getElementById("toTree").style.display = "none";
        }
        var cv = document.getElementById("cv");
        var ctx = cv.getContext("2d");
        var stars = [];
        for (var i = 0; i < 70; i++) {
            stars.push([Math.random() * 340, Math.random() * 300, Math.random() * 1.3 + 0.4]);
        }
        var flakes = [];
        for (var i = 0; i < 60; i++) {
            flakes.push([Math.random() * 340, Math.random() * 480,Math.random() * 2 + 1, Math.random() * 1 + 0.5]);
        }
        var snowOn = true;
        var lightsOn = true;
        var tick = 0;
        var extraBalls = [];
                    var lights = [
                [157, 143], [143, 168], [130, 193], [184, 143], [197, 168], [211, 193],
                [150, 210], [130, 237], [110, 265], [190, 210], [210, 237], [230, 265],
                [144, 281], [117, 313], [91, 346], [197, 281], [223, 313], [250, 346]
            ];
            var lightColors = ["#ff5a5a", "#ffd94d", "#4fc3ff", "#7dff8a"];

        function drawScene() {
            var sky = ctx.createLinearGradient(0, 0, 0, 480);
            sky.addColorStop(0, "#0b1026");
            sky.addColorStop(1, "#24365e");
            ctx.fillStyle = sky;
            ctx.fillRect(0, 0, 340, 480);
            ctx.fillStyle = "white";
            for (var i = 0; i <stars.length; i++) {
                ctx.beginPath();
                ctx.arc(stars[i][0], stars[i][1], stars[i][2], 0, Math.PI *2);
                ctx.fill();
            }
            var glow = ctx.createRadialGradient(278, 62, 8, 278, 62, 60);
            glow.addColorStop(0, "rgba(255, 244, 200, 0.55)");
            glow.addColorStop(1, "rgba(255, 244, 200, 0)");
            ctx.fillStyle = glow;
            ctx.fillRect(208, 0, 140, 132);
            ctx.fillStyle = "#fdf3c4";
            ctx.beginPath();
            ctx.arc(278, 62, 26, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#eef4ff";
            ctx.beginPath();
            ctx.ellipse(90, 492, 240, 62, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(280, 500, 240, 70, 0, 0, Math.PI * 2);
            ctx.fill();
            var tg = ctx.createLinearGradient(0, 110, 0, 380);
            tg.addColorStop(0, "#2e9e4f");
            tg.addColorStop(1, "#176b31");
            ctx.fillStyle = "#7a4a21";
            ctx.fillRect(158, 371, 24, 60);
            ctx.fillStyle = tg;
            ctx.beginPath();
            ctx.moveTo(170, 118);
            ctx.lineTo(224, 218);
            ctx.lineTo(116, 218);
            ctx.closePath();
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(170, 182);
            ctx.lineTo(250, 292);
            ctx.lineTo(90, 293);
            ctx.closePath();
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(170, 248);
            ctx.lineTo(276, 378);
            ctx.lineTo(64, 378);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = "#d63c32";
            ctx.fillRect(104, 400, 46, 32);
            ctx.fillStyle = "#ffd94d";
            ctx.fillRect(122, 400, 10, 32);
            ctx.fillRect(104, 411, 46, 8);
            ctx.fillStyle = "#2f6fd0";
            ctx.fillRect(196, 408, 38, 26);
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(211, 408, 8, 26);
            ctx.fillRect(196, 418, 38, 7);
            ctx.fillStyle = "#8b4fd8";
            ctx.fillRect(150, 418, 30, 20);
            ctx.fillStyle = "#ffd94d";
            ctx.fillRect(161, 418, 8, 20);
            ctx.fillRect(150, 426, 30, 6);
            var sg = ctx.createRadialGradient(170, 102, 4, 170, 102, 30);
            sg.addColorStop(0, "rgba(255, 217, 77, 0.55)");
            sg.addColorStop(1, "rgba(255, 217, 77, 0)");
            ctx.fillStyle = sg;
            ctx.fillRect(140, 72, 60, 60);
            ctx.fillStyle = "#ffd94d";
            ctx.beginPath();
            ctx.moveTo(170, 86);
            ctx.lineTo(174, 96);
            ctx.lineTo(185, 97);
            ctx.lineTo(177, 104);
            ctx.lineTo(179, 115);
            ctx.lineTo(170,  109);
            ctx.lineTo(161, 115);
            ctx.lineTo(163, 104);
            ctx.lineTo(155, 97);
            ctx.lineTo(166, 96);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = "#ffd94d";
            ctx.lineWidth = 5;
            ctx.beginPath();
            ctx.moveTo(112, 262);
            ctx.quadraticCurveTo(170, 290, 228, 262);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(104, 318);
            ctx.quadraticCurveTo(170, 354,  236, 318);
            ctx.stroke();
            var balls = [
                [158, 180, 6], [186, 196, 5],
                [138, 248, 7], [170, 232, 6], [204, 252, 7], [156, 272, 5],
                [118, 320, 7], [150, 300, 6], [196, 306, 7], [228, 330, 6], [132, 348, 6], [186, 352, 7]
            ];
            var ballColors = ["#ff5a5a", "#ffd94d", "#4fc3ff", "#ff8ae2", "#b28dff"];
            for (var i = 0; i < balls.length; i++) {
                ctx.fillStyle = ballColors[i % 5];
                ctx.beginPath();
                ctx.arc(balls[i][0], balls[i][1], balls[i][2], 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = "rgba(255, 255, 255, 0.55)";
                ctx.beginPath();
                ctx.arc(balls[i][0] - 2, balls[i][1] - 2, 2, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        function frame() {
            tick++;
            drawScene();
            for (var i = 0; i < extraBalls.length; i++) {
                ctx.fillStyle = lightColors[extraBalls[i][2] % 4];
                ctx.beginPath();
                ctx.arc(extraBalls[i][0], extraBalls[i][1], 7, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = "rgba(255,255,255,0.65)";
                ctx.beginPath();
                ctx.arc(extraBalls[i][0] - 2, extraBalls[i][1] - 2, 2, 0, Math.PI * 2);
                ctx.fill();
            }
            if (lightsOn) {
                for (var i = 0; i < lights.length; i++) {
                    ctx.fillStyle = lightColors[i % 4];
                    ctx.shadowColor = ctx.fillStyle;
                    ctx.shadowBlur = 12;
                    ctx.globalAlpha = 0.55 + 0.45 * Math.sin(tick * 0.08 + i * 1.7);
                    ctx.beginPath();
                    ctx.arc(lights[i][0], lights[i][1], 3.5, 0, Math.PI *2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1;
                ctx.shadowBlur = 0;
            }
            if (snowOn) {
                ctx.fillStyle = "white";
                for (var i = 0; i < flakes. length; i++) {
                    flakes[i][1] += flakes[i][3];
                    flakes[i][0] += Math.sin(tick * 0.02 + i) * 0.3;
                    if (flakes[i][1] > 485) {
                        flakes[i][1] = -5;
                        flakes[i][0] = Math.random() * 340;
                    }
                    ctx.beginPath();
                    ctx.arc(flakes[i][0], flakes[i][1], flakes[i][2], 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }
        setInterval(frame, 33);
    function toggleSnow() {
        snowOn = !snowOn;
    }
    function toggleLights() {
        lightsOn = !lightsOn;
    }
    function clearBalls() {
        extraBalls = [];
    }
cv.addEventListener("click", function (e) {
    var rect = cv.getBoundingClientRect();
    var x = (e.clientX - rect.left) * 340 / rect.width;
    var y = (e.clientY - rect.top) * 480 / rect.height;
    extraBalls.push([x, y, Math.floor(Math.random() * 4)]);
});
    </script>
</body>
</html>
